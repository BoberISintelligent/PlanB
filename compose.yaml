services:
  planb:
    build: .
    env_file: .env
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
